[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "siforge"
version = "1.1.0"
description = "Multi-engine siRNA design with a calibrated Unified Silencing Score"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "pandas>=2.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
structure = ["ViennaRNA>=2.6"]
parquet = ["pyarrow>=14"]
dev = ["pytest>=7"]

[project.scripts]
siforge = "siforge.cli:main"

[tool.setuptools.packages.find]
include = ["siforge*"]

[tool.setuptools.package-data]
siforge = ["profiles/*.yaml", "data/*.tsv"]

[tool.pytest.ini_options]
# Put the repo root on sys.path so `pytest` works from a clean checkout
# even before `pip install -e .`. Requires pytest >= 7.
pythonpath = ["."]
testpaths = ["tests"]
